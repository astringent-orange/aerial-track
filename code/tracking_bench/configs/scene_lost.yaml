# 验收场景：目标绕原点转圈，**大部分时间在画外**，用来严格验证 lost_timeout。
#
# 追踪机钉在 (0, 0, 2.5) 机头朝 +x（半视场 43.5°）。目标在半径 4.0 的圆上
# 逆时针飞（z=2.5，45° 一个路点，28 个路点 = 27 段 ≈ 69 s，够覆盖 60 s）。
#
#   * 画内弧：方位角 ∈ (−43.5°, +43.5°)，占 87° / 360°
#   * **画外弧 227° ≈ 12.9 s**，周期 20.4 s
#
# 于是：
#   * 开局在 (0, 4)（方位 90°），连续画外 12.9 s
#     ->  lost_timeout=3.0 时**恰好在第 30 步**判失败
#   * 最长的连续画外就是 12.9 s < 30 s
#     ->  lost_timeout=30.0 时**不会**触发，跑得满
#
# 这两条正是 BENCH_PLAN §3 P4 的第 2、3 条验收。之所以要"中途会回到画里"：
# 若目标从第 0 步起一直画外，30 s 超时落在第 300 步，不可能跑满 600 ——
# 计划里那两句话只有在"连续丢失会被重新入画打断"时才能同时成立。
#
# ⚠️ 别再用折线（A→B→C→D 那种）：B→C / D→A 的锐拐弯会让五次曲线鼓肚穿墙，
#    `set_waypoints` 直接拒绝（`第 [1,3,...] 段的五次曲线穿墙`）。圆弧没有这个问题。

arena_yaml: configs/arena_20x20.yaml

camera:
  image: [270, 480]
  hfov_deg: 87.0
  max_range: 10.0
  min_range: 0.2

target_policy:
  type: waypoint
  v_cruise: 1.2
  v_max: 1.2
  a_max: 1.5
  t_min: 1.0
  n_waypoints: 6
  speed_scale: 1.0
  # 半径 4.0 的圆，45° 一个点，从方位 90° 起逆时针，28 个点（≈ 3.5 圈）
  waypoints:
    - [ 0.0000,  4.0000, 2.5]
    - [-2.8284,  2.8284, 2.5]
    - [-4.0000,  0.0000, 2.5]
    - [-2.8284, -2.8284, 2.5]
    - [ 0.0000, -4.0000, 2.5]
    - [ 2.8284, -2.8284, 2.5]
    - [ 4.0000,  0.0000, 2.5]
    - [ 2.8284,  2.8284, 2.5]
    - [ 0.0000,  4.0000, 2.5]
    - [-2.8284,  2.8284, 2.5]
    - [-4.0000,  0.0000, 2.5]
    - [-2.8284, -2.8284, 2.5]
    - [ 0.0000, -4.0000, 2.5]
    - [ 2.8284, -2.8284, 2.5]
    - [ 4.0000,  0.0000, 2.5]
    - [ 2.8284,  2.8284, 2.5]
    - [ 0.0000,  4.0000, 2.5]
    - [-2.8284,  2.8284, 2.5]
    - [-4.0000,  0.0000, 2.5]
    - [-2.8284, -2.8284, 2.5]
    - [ 0.0000, -4.0000, 2.5]
    - [ 2.8284, -2.8284, 2.5]
    - [ 4.0000,  0.0000, 2.5]
    - [ 2.8284,  2.8284, 2.5]
    - [ 0.0000,  4.0000, 2.5]
    - [-2.8284,  2.8284, 2.5]
    - [-4.0000,  0.0000, 2.5]
    - [-2.8284, -2.8284, 2.5]

tracker:
  type: do_nothing
  action_mode: position
  standoff: 2.0

episode:
  max_steps: 600
  lost_timeout: 3.0        # 这一版就是要看它在第 30 步停
  lost_criterion: in_fov
  collision_is_fail: true
  settle_steps: 40
  # ⚠️ 判据不能依赖 `env_manager.reset()` 的随机初始位姿 —— 钉死它。
  #    追踪机在原点、机头朝 +x，正好让上面那张方位表成立。
  start_pose: [0.0, 0.0, 2.5, 0.0]

seed: 20261012
num_envs: 1
use_warp: true
