# 20×20 跟踪场地布局（固定，可复现）
#
# 这是场地布局的**唯一来源**。改这里就等于改场地，不用动 Python 逻辑。
# 改完要重新生成 URDF：
#     python make_wall_assets.py --from-config configs/arena_20x20.yaml
#
# 坐标约定（和 aerial_gym / IsaacGym 一致）：
#   · x/y 水平，z 上
#   · 场地是**方的** x,y ∈ [-10, 10]、z ∈ [0, 5]（不是圆）
#   · 单位 m / rad
#
# ⚠️ 墙的 URDF **原点在底面**（make_wall_assets.py 统一成这个约定，
#    和 make_cylinder_assets.py 一样）。所以 pos 只写 (x, y)，z 恒为 0 ——
#    墙就正好立在地面上。现成的 objects/1_x_1_wall.urdf 是"原点在几何中心"
#    的写法，摆上去要 z = 高度/2，两套约定混用会陷地或悬空。

arena:
  bounds_min: [-10.0, -10.0, 0.0]
  bounds_max: [10.0, 10.0, 5.0]

# 目标路点的采样范围（P2 用）。留边距是为了别贴墙/贴边飞。
waypoints:
  xy_min: [-9.0, -9.0]
  xy_max: [9.0, 9.0]
  z_range: [1.5, 4.0]
  wall_clearance: 0.5   # 路点离墙 footprint 外扩这么多

# 薄墙：围着中心摆一圈**带缺口的环**。
#
#   · 半径 5.5~6.4 m：目标在中间飞（半径 < 4）时看得到，
#     飞到环外/穿过缺口时就会被挡住 —— 产生**间歇遮挡**，不是永久遮挡。
#   · 环是断开的（角上 4 面 + 南北 2 面 + 东西 2 面，中间有缺口），
#     **不会把场地切成两半**。
#   · 中心（半径 < 3.5）完全空旷，跟踪器有充足的机动空间。
#
# size: [长(x方向), 宽(y方向), 高(z方向)]，单位 m
# pos:  [x, y]，墙原点在地面上的投影（z 恒为 0）
# yaw:  绕 z 的转角（弧度）。长边沿 x 是 yaw=0，沿 y 是 yaw=π/2
#
# ⚠️ 2026-10-13 统一成 3.0×0.3×3.0（原来角/南北墙 2.0 长、东西墙 1.2×2.0 高）：
#   目标圆盘（0.6×0.35 @ z=2）从场心看有 79 px 宽，而 1.2 m 的墙只有 57 px ——
#   圆盘比墙宽，会看起来像"串在墙上的帽+杆"组合物体。墙加宽到 3.0 m
#   （同距离 126 px）后圆盘完整嵌在墙面里，读作"目标悬在墙前"。
#   墙高 3.0 同理：墙顶要高过圆盘，圆盘不能"坐"在墙顶边上。
walls:
  # —— 角上 4 面墙，长边互相垂直，围出环的四角 ——
  - {size: [3.0, 0.3, 3.0], pos: [4.5, 4.5],   yaw: 0.0}
  - {size: [3.0, 0.3, 3.0], pos: [-4.5, 4.5],  yaw: 1.5707963}
  - {size: [3.0, 0.3, 3.0], pos: [-4.5, -4.5], yaw: 0.0}
  - {size: [3.0, 0.3, 3.0], pos: [4.5, -4.5],  yaw: 1.5707963}

  # —— 南北各一面墙 ——
  - {size: [3.0, 0.3, 3.0], pos: [0.0, 5.5],   yaw: 0.0}
  - {size: [3.0, 0.3, 3.0], pos: [0.0, -5.5],  yaw: 0.0}

  # —— 东西各一面墙 ——
  - {size: [3.0, 0.3, 3.0], pos: [5.5, 0.0],  yaw: 1.5707963}
  - {size: [3.0, 0.3, 3.0], pos: [-5.5, 0.0], yaw: 1.5707963}

# 圆柱：环内散点障碍（生成物 make_cylinder_assets.py，直径 0.6、高 3.0，
# URDF 原点在底面中心 -> pos 只写 (x, y)，z 恒为 0）。
#
# 2026-10-13 从「半径 8.5 外圈 6 根」改成「环内 8 根、方位与墙错开」：
#   · 外圈的柱子被墙环（半径 5.5~6.4）整圈挡住，从场心只看得到柱顶露头 ——
#     视频里"场景没有圆柱体"、"墙顶上顶着东西"都是它造成的；
#   · 柱子和墙落在同一条视线上会叠成"一个物体在另一个物体上"的叠影。
#     现在墙在 0°+45°k 方位，柱子放在 22.5°+45°k，半径 3.4/4.6 交错，
#     从场心看每根柱子都是完整独立的；
#   · 柱高（URDF 0.8~2.5 m）低于墙（3.0 m），柱顶永远盖不过墙顶。
#
# ⚠️ 这一节必须和 walls 一样进**自由空间检查**。踩过：2026-10-12 之前
#    `waypoint_policy.point_clear` 只吃 `arena["walls"]`，圆柱完全不查，
#    路点能采到离柱心 0.46 m（柱面只剩 0.16 m）的地方。目标是运动学驱动的、
#    直接贴着柱子飞过去，追踪机跟在后面 2 m 撞上去 —— check_p4 全量的
#    baseline 在第 161 步就是这么撞的。
cylinders:
  size: [0.6, 0.6, 3.0]
  positions:
    - [3.14, 1.30]
    - [1.76, 4.25]
    - [-1.30, 3.14]
    - [-4.25, 1.76]
    - [-3.14, -1.30]
    - [-1.76, -4.25]
    - [1.30, -3.14]
    - [4.25, -1.76]
