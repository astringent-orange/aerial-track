# 验收场景：目标**连续被墙挡 3 s 以上**，验证"遮挡不算丢失"（§2.6）。
#
# 追踪机钉在 (0, 3.0, 2.5) 机头朝 +y，正对着 wall_04（在 (0, 5.5)，
# 2.0 x 0.3 x 3.0，z∈[0,3]）。目标在墙外 y=8 的一条横线上来回：
#
#     (-1.9, 8, 2.5)  ->  (1.9, 8, 2.5)
#
# 几何（都验过）：
#   * 视线在 y=5.5 处的 x = 0.5·x_t，|0.5·x_t| ≤ 0.95 < 墙半宽 1.0
#     -> 整条线**都被墙挡住**，`visible=False`
#   * 方位角 atan2(x_t, 5) 最大 20.8° < 半视场 43.5°
#     -> `in_fov=True` 全程成立
#   * 段长 3.8 m，v_max 压到 0.6 -> Ti = max(1, 3.8/0.6, 2.25) = 6.33 s
#     -> 连续遮挡 63 步 > 30 步
#
# 判据：`lost_criterion=in_fov` 时**跑满不判失败**（遮挡不计丢失）；
# 把 `lost_criterion` 换成 `visible`，同一场景应当在第 30 步判失败 ——
# 这一对对照证明判据开关是真接上的，不是写在配置里没人读。

arena_yaml: configs/arena_20x20.yaml

camera:
  image: [270, 480]
  hfov_deg: 87.0
  max_range: 10.0
  min_range: 0.2

target_policy:
  type: waypoint
  v_cruise: 0.6
  v_max: 0.6          # 段时长按它反推：把这一段拖到 6.33 s
  a_max: 1.5
  t_min: 1.0
  n_waypoints: 2
  speed_scale: 1.0
  waypoints:
    - [-1.9, 8.0, 2.5]
    - [ 1.9, 8.0, 2.5]

tracker:
  # ⚠️ 必须 do_nothing（钉死 start_pose）。用 baseline 会被它拉着翻过墙，
  #    遮挡几何整个作废 —— check_p4 --quick 实测 occluded_steps 只有 3，
  #    因为 baseline 直接飞到目标旁边（dist≈2.0）绕开了墙。
  type: do_nothing
  action_mode: position
  standoff: 2.0

episode:
  max_steps: 80       # 8 s，够覆盖 6.33 s 的连续遮挡
  lost_timeout: 3.0
  lost_criterion: in_fov
  collision_is_fail: true
  settle_steps: 40
  start_pose: [0.0, 3.0, 2.5, 1.5707963267948966]   # 原点朝 +y

seed: 20261012
num_envs: 1
use_warp: true
